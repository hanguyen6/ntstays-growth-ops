<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<!-- PRIVATE. Generated by stats/build_stats.py from platform exports. Contains revenue: never put it in site/. -->
<style>
  :root {
    color-scheme: light;
    --bg: #f6f1e7; --surface: #fcfcfb; --line: #e4dbcc; --grid: #ece6da;
    --text: #2b211b; --text-2: #5a4f47; --muted: #7a6e65; --accent: #b08a3e; --warn-bg: #fbeed3;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --seq: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141312; --surface: #1a1a19; --line: #34322f; --grid: #2a2926;
      --text: #f3efe8; --text-2: #c3c2b7; --muted: #9a978d; --accent: #d9b56a; --warn-bg: #3a2f1a;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --seq: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141312; --surface: #1a1a19; --line: #34322f; --grid: #2a2926;
    --text: #f3efe8; --text-2: #c3c2b7; --muted: #9a978d; --accent: #d9b56a; --warn-bg: #3a2f1a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq: #3987e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font: 650 1.7rem Georgia, serif; margin: 0; }
  h2 { font: 650 1.15rem Georgia, serif; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
  .warn { background: var(--warn-bg); border-color: var(--accent); }
  .warn ul { margin: 6px 0 0; padding-left: 18px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .k { color: var(--text-2); font-size: .82rem; }
  .tile .v { font-size: 1.65rem; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .n { color: var(--muted); font-size: .78rem; }
  .two { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .two .panel { margin-top: 18px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--text-2); margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; font-size: .82rem; box-shadow: 0 6px 20px rgba(0,0,0,.15); display: none; min-width: 150px; z-index: 5; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 4px 10px; align-items: center; font-size: .88rem; }
  .hbar .track { height: 12px; }
  .hbar .fill { height: 12px; border-radius: 0 4px 4px 0; background: var(--seq); min-width: 2px; }
  .hbar .num { color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  .scroll { overflow-x: auto; }
  details { margin-top: 10px; font-size: .88rem; }
  summary { cursor: pointer; color: var(--text-2); }
  .review { border-top: 1px solid var(--line); padding: 10px 0; }
  .review:first-child { border-top: 0; }
  .review .meta { color: var(--muted); font-size: .82rem; }
  .pill { display: inline-block; font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; color: var(--text-2); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const S = /*__STATS__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = new Intl.NumberFormat('en-US', { style: 'currency', currency: S.currency || 'USD', maximumFractionDigits: 0 });
const money = v => v == null ? '–' : cur.format(v);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const num = v => v == null ? '–' : Number(v).toLocaleString('en-US');
const color = i => `var(--s${(i % 8) + 1})`;
const props = S.properties;
const monthLabel = m => new Date(m + '-15').toLocaleString('en-US', { month: 'short' });

const t = S.total_l12m, all = S.total_all_time, r = S.ratings;
const tiles = [
  ['Gross revenue', money(t.gross), 'last 12 months'],
  ['Your payout', money(t.payout), `after ${money(t.fees)} platform fees`],
  ['Occupancy', pct(t.occupancy), `${num(t.occupied)} of ${num(t.available)} home-nights had a guest`],
  ['Avg nightly rate', money(t.adr), 'gross ÷ booked nights'],
  ['RevPAR', money(t.revpar), 'gross ÷ available nights'],
  ['Avg stay', t.avg_stay == null ? '–' : t.avg_stay + ' nights', `booked ${t.avg_lead_days ?? '–'} days ahead on avg`],
  ['Guest rating', r.avg == null ? '–' : r.avg.toFixed(2) + ' ★', `${num(r.count)} reviews`],
  ['On the books', money(S.on_the_books_90d.gross), `${num(S.on_the_books_90d.nights)} nights, next 90 days`],
];

function hbars(rows, fmt) {
  if (!rows.length) return '<p class="empty">No data yet.</p>';
  const max = Math.max(...rows.map(x => x.value), 1);
  return `<div class="hbar">${rows.map(x => `<span>${esc(x.label)}</span>
    <div class="track"><div class="fill" style="width:${(x.value / max * 100).toFixed(1)}%"></div></div>
    <span class="num">${fmt(x)}</span>`).join('')}</div>`;
}

const sumGross = S.channels.reduce((a, c) => a + c.gross, 0) || 1;
const o = S.origins;
const coverage = o.stays_total ? Math.round(o.stays_with_origin / o.stays_total * 100) : 0;

// Marketing: our website pipeline (HubSpot export) next to Airbnb's own listing funnel (performance reports).
const M = S.marketing || { airbnb: { months: [], listings: [], by_home: [], partial: {} }, pipeline: { contacts_file: false } };
const P = M.pipeline, A = M.airbnb;
const rate = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
const propName = id => (props.find(p => p.id === id) || { name: String(id).replace(/^\?/, '') }).name;
const mLabel = m => new Date(m + '-15').toLocaleString('en-US', { month: 'short', year: '2-digit' }) + (A.partial[m] ? '*' : '');
function funnelTable(rows, label) {
  if (!rows || !rows.length) return '<p class="empty">No data yet.</p>';
  return `<div class="scroll"><table><tr><th>${label}</th><th>Inquiries</th><th>Quoted</th><th>Booked</th><th>Inquiry → booked</th></tr>
    ${rows.map(x => `<tr><td>${esc(x.key)}</td><td>${x.inquiries}</td><td>${x.quoted}</td><td>${x.booked}</td>
      <td>${rate(x.booked, x.inquiries)}</td></tr>`).join('')}</table></div>`;
}
function pipelinePanel() {
  if (!P.contacts_file) return `<p class="empty">No HubSpot export yet. In HubSpot: Contacts → Export, with the NTStays tracking
    columns; save the file in stats/exports and run the builder again (SETUP.md, "Campaign tracking").</p>`;
  const tot = P.total;
  return `<div class="tiles">
      <div class="tile"><div class="k">Inquiries</div><div class="v">${num(tot.inquiries)}</div><div class="n">forms and chat</div></div>
      <div class="tile"><div class="k">Quoted</div><div class="v">${num(tot.quoted)}</div><div class="n">${rate(tot.quoted, tot.inquiries)} of inquiries got a reply</div></div>
      <div class="tile"><div class="k">Booked</div><div class="v">${num(tot.booked)}</div><div class="n">${rate(tot.booked, tot.quoted)} of quotes, ${rate(tot.booked, tot.inquiries)} of inquiries</div></div>
    </div>
    <div class="two"><div class="panel"><h2>By source</h2>${funnelTable(P.by_source, 'Source / medium')}</div>
      <div class="panel"><h2>By campaign</h2>${funnelTable(P.by_campaign, 'Campaign')}</div></div>
    <div class="two"><div class="panel"><h2>How they heard about us</h2>${funnelTable(P.by_heard, 'Answer')}</div>
      <div class="panel"><h2>By month</h2>${funnelTable(P.by_month.map(x => ({ ...x, key: mLabel(x.key).replace('*', '') })), 'Month')}</div></div>`;
}
function airbnbPanel() {
  if (!A.months.length) return `<p class="empty">No Airbnb performance reports yet. On Airbnb: Performance → download the monthly
    report, one file per month; save them in stats/exports and run the builder again.</p>`;
  const cell = (m, pid) => { const x = A.by_home.find(r => r.month === m && r.property === pid);
    return x && x.bookings ? `${x.bookings} · ${x.nights} n · ${money(x.value)}` : '–'; };
  const homeIds = [...new Set(A.by_home.map(r => r.property))];
  const active = A.listings.filter(l => Object.values(l.months).some(v => v.bookings || v.view_to_contact != null));
  const quiet = A.listings.length - active.length;
  return `<div class="scroll"><table>
      <tr><th>Home</th>${A.months.map(m => `<th>${mLabel(m)}</th>`).join('')}</tr>
      ${homeIds.map(pid => `<tr><td>${esc(propName(pid))}</td>${A.months.map(m => `<td>${cell(m, pid)}</td>`).join('')}</tr>`).join('')}
    </table></div>
    <p class="sub">Bookings · nights · booking value, all listings of each home.</p>
    <h2 style="margin-top:14px">Listing funnel: view → contact, contact → book</h2>
    <div class="scroll"><table>
      <tr><th>Listing</th>${A.months.map(m => `<th>${mLabel(m)}</th>`).join('')}</tr>
      ${active.map(l => `<tr><td>${esc(propName(l.property))}: ${esc(l.internal_name || l.title)}</td>${A.months.map(m => {
        const v = l.months[m]; if (!v || (v.view_to_contact == null && v.contact_to_book == null && !v.bookings)) return '<td>–</td>';
        return `<td>${pct(v.view_to_contact)} → ${pct(v.contact_to_book)}${v.bookings ? ` <span class="pill">${v.bookings} booked</span>` : ''}</td>`;
      }).join('')}</tr>`).join('') || `<tr><td colspan="${A.months.length + 1}" class="empty">No views or bookings in these months</td></tr>`}
    </table></div>
    <p class="sub">View → contact: share of listing views that messaged or asked to book. Contact → book: share of those that booked
      (over 100% when Instant Book guests booked without a message first). ${quiet ? `${quiet} listing(s) with no views data or bookings not shown. ` : ''}${Object.keys(A.partial).length ? '* month not over when the report was downloaded.' : ''}</p>`;
}

$('#app').innerHTML = `
  <h1>NTStays stats</h1>
  <p class="sub">As of ${esc(S.today)} · last 12 months = ${esc(S.window[0])} to ${esc(S.window[1])} ·
    sources: ${Object.entries(S.sources).map(([k, v]) => `${esc(k)} ${v}`).join(', ') || 'none'} ·
    ${S.cancelled} cancelled · private, do not publish</p>
  ${S.warnings.length ? `<div class="panel warn"><b>Check these</b><ul>${S.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
  <div class="tiles">${tiles.map(([k, v, n]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('')}</div>

  <div class="panel">
    <h2>Gross revenue by month</h2>
    <p class="sub">Each night's share of its booking, by the month the night falls in. Last 24 months.</p>
    ${props.length > 1 ? `<div class="legend">${props.map((p, i) => `<span><i style="background:${color(i)}"></i>${esc(p.name)}</span>`).join('')}</div>` : ''}
    <div class="chart" id="monthly"></div>
    <details><summary>Table view</summary><div class="scroll"><table>
      <tr><th>Month</th>${props.map(p => `<th>${esc(p.name)}</th>`).join('')}<th>Total</th><th>Nights</th></tr>
      ${S.monthly.map(m => `<tr><td>${m.month}</td>${props.map(p => `<td>${money(m[p.id].gross)}</td>`).join('')}
        <td>${money(props.reduce((a, p) => a + m[p.id].gross, 0))}</td><td>${props.reduce((a, p) => a + m[p.id].nights, 0)}</td></tr>`).join('')}
    </table></div></details>
  </div>

  <div class="panel">
    <h2>By property</h2>
    <div class="scroll"><table>
      <tr><th>Property</th><th>Gross 12m</th><th>Payout 12m</th><th>Occupancy</th><th>Avg rate</th><th>RevPAR</th>
        <th>Stays</th><th>Avg stay</th><th>Lead days</th><th>Rating</th><th>Gross all-time</th></tr>
      ${S.per_property.map(p => { const a = p.l12m, rp = r.by_property[p.id]; return `<tr><td>${esc(p.name)}</td>
        <td>${money(a.gross)}</td><td>${money(a.payout)}</td><td>${pct(a.occupancy)}</td><td>${money(a.adr)}</td>
        <td>${money(a.revpar)}</td><td>${a.stays}</td><td>${a.avg_stay ?? '–'}</td><td>${a.avg_lead_days ?? '–'}</td>
        <td>${rp ? rp.avg.toFixed(2) + ' (' + rp.count + ')' : '–'}</td><td>${money(p.all_time.gross)}</td></tr>`; }).join('')}
    </table></div>
  </div>

  <div class="panel">
    <h2>Short-term vs medium-term</h2>
    <p class="sub">Medium-term = stays of 28+ nights (nurses, professionals, insurance placements). Leases booked outside the platforms come from leases.csv in stats/exports.</p>
    <div class="scroll"><table>
      <tr><th>Type</th><th>Gross 12m</th><th>Nights 12m</th><th>Stays 12m</th><th>Gross all-time</th><th>Nights all-time</th><th>Stays all-time</th><th>Avg stay</th></tr>
      ${Object.keys(S.stay_types.all_time).map(k => { const a = S.stay_types.l12m[k], b = S.stay_types.all_time[k]; return `<tr><td>${esc(k)}</td>
        <td>${money(a.gross)}</td><td>${num(a.nights)}</td><td>${a.stays}</td><td>${money(b.gross)}</td><td>${num(b.nights)}</td>
        <td>${b.stays}</td><td>${b.avg_stay ?? '–'} nights</td></tr>`; }).join('')}
    </table></div>
  </div>

  <div class="two">
    <div class="panel">
      <h2>Channel mix</h2>
      <p class="sub">Share of gross revenue, last 12 months</p>
      ${hbars(S.channels.map(c => ({ label: c.platform, value: c.gross, c })),
        x => `${Math.round(x.value / sumGross * 100)}% · ${money(x.value)} · ${x.c.nights} nights`)}
      <p class="sub">Platform fees: ${S.channels.map(c => `${esc(c.platform)} ${c.gross ? Math.round((c.gross - c.payout) / c.gross * 100) : 0}%`).join(', ') || '–'}</p>
    </div>
    <div class="panel">
      <h2>Where guests come from</h2>
      <p class="sub">${o.countries.length} countries, ${o.us_states.length} US states · origin known for ${o.stays_with_origin} of ${o.stays_total} stays (${coverage}%)</p>
      ${hbars(o.top.map(x => ({ label: x.name, value: x.stays })), x => `${x.value} stay${x.value === 1 ? '' : 's'}`)}
      ${coverage < 60 ? '<p class="sub">Booking.com exports include the booker country. For Airbnb and Vrbo, add city/state from the guest profile to guest_origins.csv.</p>' : ''}
    </div>
  </div>

  <div class="panel">
    <h2>Website pipeline, last 12 months</h2>
    <p class="sub">Requests from the website forms and chat, from the HubSpot contacts export. Quoted = your reply was sent;
      booked = paid by card link. Source = the campaign link or website that brought them (SETUP.md, "Campaign tracking").</p>
    ${pipelinePanel()}
  </div>

  <div class="panel">
    <h2>Airbnb listing performance</h2>
    <p class="sub">From Airbnb's monthly performance reports.</p>
    ${airbnbPanel()}
  </div>

  <div class="panel">
    <h2>Reviews</h2>
    <p class="sub">Scores out of 10 (Booking.com, Vrbo) are shown out of 5. To show a review on the website, add its code to "feature_codes" in config.json (4★+ with text only).</p>
    <div class="scroll"><table>
      <tr><th>Property</th><th>Average</th><th>Reviews</th><th>5★</th><th>4★</th><th>3★</th><th>2★</th><th>1★</th></tr>
      ${Object.entries(r.by_property).map(([pid, v]) => `<tr><td>${esc((props.find(p => p.id === pid) || { name: pid }).name)}</td>
        <td>${v.avg.toFixed(2)}</td><td>${v.count}</td>${[5, 4, 3, 2, 1].map(k => `<td>${v.dist[k]}</td>`).join('')}</tr>`).join('')
        || '<tr><td colspan="8" class="empty">No reviews.csv yet</td></tr>'}
    </table></div>
    <details><summary>All reviews (${S.reviews.length})</summary>
      ${S.reviews.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(x => `<div class="review">
        <div><b>${'★'.repeat(Math.round(x.rating))}</b> ${esc(x.display_name)}${x.feature ? '<span class="pill">on website</span>' : ''}</div>
        <div class="meta">${esc(x.date)} · ${esc(x.platform)} · ${esc((props.find(p => p.id === x.property) || { name: x.property }).name)}${x.origin ? ' · ' + esc(x.origin) : ''} · code <code>${esc(x.code)}</code></div>
        ${x.title ? `<div><b>${esc(x.title)}</b></div>` : ''}
        <div>${esc(x.text) || '<span class="empty">(score only, no text)</span>'}</div>
        ${x.negative ? `<div class="meta">Didn't like: ${esc(x.negative)}</div>` : ''}</div>`).join('')}
    </details>
  </div>`;

// Stacked monthly bars with a hover tooltip.
(function monthlyChart() {
  const W = 1100, H = 280, L = 56, B = 26, T = 8, n = S.monthly.length;
  const totals = S.monthly.map(m => props.reduce((a, p) => a + m[p.id].gross, 0));
  const max = Math.max(...totals, 1);
  const step = [1, 2, 2.5, 5, 10].map(f => f * Math.pow(10, Math.floor(Math.log10(max / 4)))).find(s => max / s <= 5);
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L) / n, barW = Math.max(bw * 0.62, 4);
  let svg = '';
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" />
      <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${cur.format(v).replace(/,000$/, 'k')}</text>`;
  }
  S.monthly.forEach((m, i) => {
    const x = L + i * bw + (bw - barW) / 2;
    let acc = 0;
    const segs = props.map((p, k) => ({ k, v: m[p.id].gross })).filter(s => s.v > 0);
    segs.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.v), h = Math.max(y0 - y1 - (j ? 2 : 0), 1);
      const isTop = j === segs.length - 1;
      svg += isTop
        ? `<path d="M${x},${y0 - (j ? 2 : 0)} V${y1 + 4} Q${x},${y1} ${x + 4},${y1} H${x + barW - 4} Q${x + barW},${y1} ${x + barW},${y1 + 4} V${y0 - (j ? 2 : 0)} Z" fill="${color(s.k)}" />`
        : `<rect x="${x}" y="${y1}" width="${barW}" height="${h}" fill="${color(s.k)}" />`;
      acc += s.v;
    });
    if (i % 3 === 0 || i === n - 1) svg += `<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${monthLabel(m.month)}${m.month.endsWith('-01') || i === 0 ? ' ’' + m.month.slice(2, 4) : ''}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" />`;
  });
  svg += `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" />`;
  const box = $('#monthly');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gross revenue by month, stacked by property">${svg}</svg>`;
  const tip = $('#tip');
  box.addEventListener('mousemove', e => {
    const hit = e.target.closest('.hit');
    if (!hit) { tip.style.display = 'none'; return; }
    const m = S.monthly[+hit.dataset.i];
    const nights = props.reduce((a, p) => a + m[p.id].nights, 0);
    tip.innerHTML = `<b>${new Date(m.month + '-15').toLocaleString('en-US', { month: 'long', year: 'numeric' })}</b>
      ${props.map((p, k) => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${color(k)};margin-right:5px"></i>${esc(p.name)}</span><span>${money(m[p.id].gross)}</span></div>`).join('')}
      <div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Total · ${nights} nights</span><span>${money(totals[+hit.dataset.i])}</span></div>`;
    tip.style.display = 'block';
    const px = e.pageX + 14, max = window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8;
    tip.style.left = Math.min(px, max) + 'px';
    tip.style.top = (e.pageY + 14) + 'px';
  });
  box.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
})();
</script>
</body>
</html>
